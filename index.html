<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Airelys 🫶</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }
        .card {
            background: rgba(255, 255, 255, 0.92);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 380px;
            width: 90%;
            z-index: 10;
            position: relative;
        }
        h1 { color: #d81b60; font-size: 26px; margin-bottom: 15px; }
        p { color: #444; font-size: 16px; line-height: 1.6; margin-bottom: 20px; }
        .highlight { color: #c2185b; font-weight: bold; }
        .footer-note { font-size: 13px; color: #777; margin-top: 15px; }
        
        audio {
            width: 100%;
            margin: 15px 0 10px 0;
            border-radius: 25px;
            outline: none;
        }

        .heart {
            position: absolute; background: rgba(255, 255, 255, 0.6);
            width: 15px; height: 15px; transform: rotate(45deg);
            animation: float 6s infinite ease-in-out; z-index: 1;
        }
        .heart::before, .heart::after {
            content: ''; position: absolute; width: 15px; height: 15px;
            background: rgba(255, 255, 255, 0.6); border-radius: 50%;
        }
        .heart::before { top: -7.5px; left: 0; }
        .heart::after { top: 0; left: -7.5px; }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(45deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="heart" style="left: 10%; animation-delay: 0s;"></div>
    <div class="heart" style="left: 30%; animation-delay: 2s;"></div>
    <div class="heart" style="left: 50%; animation-delay: 4s;"></div>
    <div class="heart" style="left: 70%; animation-delay: 1s;"></div>
    <div class="heart" style="left: 90%; animation-delay: 3s;"></div>

    <div class="card">
        <h1>¡Me gustas, Airelys! 🫶</h1>
        <p>
            Hola. Quería decirte que <span class="highlight">me gustas muchísimo</span>. 
            Quiero también que sepas que a tu niña no le falte nada, y que al igual que ella, 
            ambas siempre cuenten conmigo para lo que necesiten.
        </p>
        
        <!-- Reproductor de audio directo y funcional -->
        <audio controls>
            <source src="https://actions.google.com/sounds/v1/ambiences/romantic_getaway.ogg" type="audio/ogg">
            Tu navegador no soporta el elemento de audio.
        </audio>

        <p class="footer-note">Un detalle especial para ti.</p>
    </div>
</body>
</html>
